/* Arma la semana: días 0 (viernes de inicio, desde las 13:00) a 7 (viernes de cierre, hasta las 13:00). */
function assignments(w){
  var t=TPL_BY[w.tipo], days=[], i;
  for(i=0;i<8;i++) days.push([]);
  ['insp','sup'].forEach(function(role){
    var names=w[role]||[], rows=role==='insp'?t.rows:t.sup, ini=role==='insp'?t.ini:SUP_INI;
    ini.forEach(function(g){ g.k.forEach(function(k){
      days[0].push({k:k,slot:role+':'+k,role:role,name:names[k-1]||'',sector:g.s,turno:g.tu===1?'1er turno':'2do turno',h:g.tu===1?VI1:VI2});
    });});
    rows.forEach(function(r){
      for(var j=0;j<6;j++) days[j+1].push({k:r.d[j],role:role,name:names[r.d[j]-1]||'',sector:r.s,turno:'Turno '+r.t.toLowerCase(),h:r.h});
      days[7].push({k:r.d[6],slot:role+':'+r.d[6],role:role,name:names[r.d[6]-1]||'',sector:r.vs,turno:'Cierre de semana',h:r.vh});
    });
  });
  /* Ajustes manuales de los viernes (entra tarde, se va antes, cambio de sector). Clave: "día:rol:posición". */
  var aj=w.ajustes||{};
  [0,7].forEach(function(i){days[i].forEach(function(a){var x=aj[i+':'+a.role+':'+a.k];
    if(x){if(x.h)a.h=x.h;if(x.s)a.sector=x.s;a.adj=true;}});});
  /* Intercambios de los viernes: dos lugares (slot) se cambian a quién tienen. */
  (w.cambios||[]).forEach(function(c){
    var A=null,B=null;(days[c.d]||[]).forEach(function(a){if(a.slot===c.x)A=a;if(a.slot===c.y)B=a;});
    if(!A||!B||A===B) return;
    var t={k:A.k,role:A.role,name:A.name};
    A.k=B.k;A.role=B.role;A.name=B.name;B.k=t.k;B.role=t.role;B.name=t.name;A.sw=true;B.sw=true;
  });
  return days;
}

/* ---------- PDF con el formato de la planilla GRILLAS (columnas A a O) ----------
   A–C: viernes de inicio (1er y 2do turno) · E: sector · F: turno · G: horario
   H–N: sábado a viernes · O: horario del viernes de cierre.
   Colores como en cada hoja de la planilla, según el tipo de grilla.
   El texto va en posiciones que también lee la micro app "Grilla San Sebastián". */
var JSPDF_URL='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
var jsPdfCarga=null, DL=null;
function cargarJsPdf(){
  if(window.jspdf&&window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if(jsPdfCarga) return jsPdfCarga;
  jsPdfCarga=new Promise(function(ok,ko){var s=document.createElement('script');s.src=JSPDF_URL;
    s.onload=function(){ok(window.jspdf.jsPDF);};
    s.onerror=function(){jsPdfCarga=null;ko(new Error('No pude cargar el generador de PDF. Revisá la conexión y probá de nuevo.'));};
    document.head.appendChild(s);});
  return jsPdfCarga;
}
var PC={Y:[255,229,153],G:[147,196,125],B:[164,194,244],P:[244,204,204],O:[255,153,0],O2:[230,145,56],Y2:[241,194,50],R:[224,102,102],T:[17,85,204],W:[255,255,255]};
/* Diferencias de color de cada hoja (índice de fila de la grilla de inspectores). */
var HOJA={'6':{fila:{4:'O2'},vie:{4:'B'}},'7':{},'7F':{vie:{4:'O'}},'7V':{fila:{2:'Y2',6:'R'},vie:{5:'B',6:'R'},colO:true},'8':{}};
var NOMBRE_HOJA={'6':'6 INSPECTORES','7':'7 INSPECTORES','7F':'7 INSP. TURNO FIJO','7V':'7 INSPECTORES VERANO','8':'8 INSPECTORES'};
function colorBase(s,t){if(t==='MEDIO'||t==='FIJO')return 'O';var m=t==='MAÑANA';return s==='SALIDA'?(m?'Y':'G'):(m?'B':'P');}
function p2(n){return String(n).padStart(2,'0');}
function ddmm(d,sep){return p2(d.getDate())+(sep||'/')+p2(d.getMonth()+1);}
function pdfNombre(w){return 'Grilla San Sebastian '+ddmm(fromIso(w.desde),'-')+' al '+ddmm(fromIso(w.hasta),'-')+'.pdf';}
function deTxt(h){var m=String(h).match(/(\d{1,2}:\d{2})\D+(\d{1,2}:\d{2})/);return m?'DE '+m[1]+' A '+m[2]:String(h);}
function cortoH(h){var m=String(h).match(/(\d{1,2}:\d{2})\D+(\d{1,2}:\d{2})/);return m?m[1]+'-'+m[2]:String(h);}

function pdfGrilla(jsPDF,w){
  var t=TPL_BY[w.tipo], hoja=HOJA[w.tipo]||{}, days=assignments(w);
  var doc=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
  var PW=doc.internal.pageSize.getWidth(), M=20;
  var PX=[90,90,90,21,90,90,103,90,90,90,90,90,90,90,93], tot=PX.reduce(function(a,b){return a+b;},0), k=(PW-2*M)/tot;
  var X=[M]; PX.forEach(function(p,i){X.push(X[i]+p*k);});
  var RH=15, TH=26;
  function fill(c){var v=PC[c]||PC.W;doc.setFillColor(v[0],v[1],v[2]);}
  /* celda (o celdas combinadas) de las columnas c1..c2, desde y, alto h */
  function celda(c1,c2,y,h,color,txt,o){
    o=o||{};
    if(color&&color!=='W'){fill(color);doc.rect(X[c1],y,X[c2+1]-X[c1],h,'F');}
    if(o.borde!==false){doc.setDrawColor(0,0,0);doc.setLineWidth(0.4);doc.rect(X[c1],y,X[c2+1]-X[c1],h,'S');}
    if(txt){
      doc.setFont('helvetica',o.bold?'bold':'normal');doc.setFontSize(o.size||7);
      var tc=o.color||[0,0,0];doc.setTextColor(tc[0],tc[1],tc[2]);
      doc.text(String(txt),(X[c1]+X[c2+1])/2,y+(o.dy!=null?o.dy:h/2+(o.size||7)*0.35),{align:'center'});
    }
  }
  /* texto invisible por fila: así la micro app asocia cada fila con su sector, turno y horario */
  function oculto(c1,c2,y,txt,size){
    doc.setFont('helvetica','normal');doc.setFontSize(size||6);
    doc.text(String(txt),(X[c1]+X[c2+1])/2,y+RH/2+(size||6)*0.35,{align:'center',renderingMode:'invisible'});
  }
  /* agrupa filas consecutivas con la misma clave */
  function grupos(n,clave){var g=[],i;for(i=0;i<n;i++){var kk=clave(i);if(g.length&&g[g.length-1].k===kk)g[g.length-1].n++;else g.push({k:kk,i:i,n:1});}return g;}

  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(17,34,43);
  doc.text('GRILLA PASO SAN SEBASTIÁN',M,26);
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(70,80,90);
  doc.text((NOMBRE_HOJA[w.tipo]||w.tipo)+'  ·  del viernes '+ddmm(fromIso(w.desde))+' (13:00) al viernes '+ddmm(fromIso(w.hasta))+' (13:00)',M,38);

  var DN=['SABADO','DOMINGO','LUNES','MARTES','MIERCOLES','JUEVES','VIERNES'];
  function seccion(y,titulo,role){
    var rows=role==='insp'?t.rows:t.sup, ini=role==='insp'?t.ini:SUP_INI, names=w[role]||[];
    var colF=function(i){var r=rows[i];return role==='insp'?((hoja.fila||{})[i]||colorBase(r.s,r.t)):colorBase(r.s,r.t);};
    /* título */
    celda(4,14,y,TH,'T',titulo,{size:13,color:[255,255,255],borde:false});
    y+=TH;
    /* encabezado de días */
    for(var d=0;d<7;d++){
      var c=7+d, c2=d===6?14:c;
      doc.setFont('helvetica','normal');doc.setFontSize(5.5);doc.setTextColor(90,100,110);
      doc.text(ddmm(dayDate(w,d+1)),(X[c]+X[c2+1])/2,y+6,{align:'center'});
      doc.setFontSize(7);doc.setTextColor(0,0,0);
      doc.text(DN[d],(X[c]+X[c2+1])/2,y+RH+3.5,{align:'center'});
      doc.setDrawColor(0,0,0);doc.setLineWidth(0.6);doc.line(X[c],y+RH+6,X[c2+1],y+RH+6);
    }
    y+=RH+6;
    var y0=y, n=rows.length;
    /* E: sector */
    grupos(n,function(i){return rows[i].s;}).forEach(function(g){
      celda(4,4,y0+g.i*RH,g.n*RH,'W',g.k,{size:7});
      for(var j=0;j<g.n;j++) oculto(4,4,y0+(g.i+j)*RH,g.k,7);
    });
    /* F: turno */
    grupos(n,function(i){return rows[i].s+'|'+rows[i].t;}).forEach(function(g){
      var r=rows[g.i], lab=(role==='insp'?'TURNO ':'')+r.t;
      celda(5,5,y0+g.i*RH,g.n*RH,colorBase(r.s,r.t),lab,{size:5.5});
      for(var j=0;j<g.n;j++) oculto(5,5,y0+(g.i+j)*RH,lab,5.5);
    });
    /* G: horario */
    grupos(n,function(i){return rows[i].h+'|'+colF(i);}).forEach(function(g){
      celda(6,6,y0+g.i*RH,g.n*RH,colF(g.i),deTxt(rows[g.i].h),{size:5.5});
      for(var j=0;j<g.n;j++) oculto(6,6,y0+(g.i+j)*RH,deTxt(rows[g.i].h),5.5);
    });
    /* O: viernes de cierre (y color de la columna N del viernes) */
    var gO=grupos(n,function(i){return rows[i].vh;}), colN={};
    gO.forEach(function(g){
      var r=rows[g.i], first=colF(g.i);
      for(var j=0;j<g.n;j++) colN[g.i+j]=g.n>1?first:colorBase(rows[g.i+j].vs,rng(r.vh)[0]<540?'MAÑANA':'TARDE');
    });
    gO.forEach(function(g){
      var r=rows[g.i], txt=deTxt(r.vh)+(role==='insp'&&hoja.colO&&r.vs==='SALIDA'?' SALIDA':'');
      celda(14,14,y0+g.i*RH,g.n*RH,hoja.colO&&role==='insp'?colN[g.i]:'W',txt,{size:5.5});
      for(var j=0;j<g.n;j++) oculto(14,14,y0+(g.i+j)*RH,txt,5.5);
    });
    /* H–N: nombres */
    rows.forEach(function(r,i){
      var yy=y0+i*RH;
      for(var d=0;d<6;d++) celda(7+d,7+d,yy,RH,colF(i),names[r.d[d]-1]||'',{size:7});
      var cN=(role==='insp'&&(hoja.vie||{})[i])||colN[i];
      var a=null;days[7].forEach(function(z){if(z.slot===role+':'+r.d[6])a=z;});var nmN=a?a.name:(names[r.d[6]-1]||'');
      if(a&&a.adj){
        celda(13,13,yy,RH,cN,nmN,{size:6.5,dy:6.5});
        doc.setFontSize(4.8);doc.text(cortoH(a.h)+(a.sector!==r.vs?' '+a.sector:''),(X[13]+X[14])/2,yy+12.8,{align:'center'});
      } else celda(13,13,yy,RH,cN,nmN,{size:7});
    });
    /* A–C: viernes de inicio */
    var fila=0, colIni={'1SALIDA':'Y','1ENTRADA':'B','2SALIDA':'G','2ENTRADA':'P'};
    [1,2].forEach(function(tu){
      var gs=ini.filter(function(g){return g.tu===tu;}), cnt=0;
      gs.forEach(function(g){cnt+=g.k.length;});
      if(!cnt) return;
      celda(0,0,y0+fila*RH,cnt*RH,'W',tu===1?'1ER TURNO':'2DO TURNO',{size:7});
      gs.forEach(function(g){
        var cl=colIni[tu+g.s];
        celda(1,1,y0+fila*RH,g.k.length*RH,cl,g.s,{size:7});
        g.k.forEach(function(kk){
          var a=null;days[0].forEach(function(z){if(z.slot===role+':'+kk)a=z;});
          var nm=a?a.name:(names[kk-1]||'');
          if(a&&a.adj){
            celda(2,2,y0+fila*RH,RH,cl,nm,{size:6.5,dy:6.5});
            doc.setFontSize(4.8);doc.text(cortoH(a.h)+(a.sector!==g.s?' '+a.sector:''),(X[2]+X[3])/2,y0+fila*RH+12.8,{align:'center'});
          } else celda(2,2,y0+fila*RH,RH,cl,nm,{size:7});
          fila++;
        });
      });
    });
    return y0+Math.max(n,fila)*RH;
  }
  var y=seccion(48,'INSPECTORES','insp');
  seccion(y+RH*1.5,'SUPERVISORES','sup');
  return doc;
}

      DL.save({filename:name,data:blob}).then(function(){},function(e){
        var c=e&&e.code; if(c==='declined') return;
        S.msg={kind:'err',text:c==='rate_limited'?'Ya hay una descarga esperando confirmación.':'No se pudo descargar el PDF ('+(c||'error')+').'};render();
      });
    } else {
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},5000);

var PDFJS_URL='', pdfjsCarga=null;
function mensuales(){return (DATA.mensuales||[]).slice().sort(function(a,b){return b.mes.localeCompare(a.mes)||String(b.subido).localeCompare(String(a.subido));});}
function mesLabel(m){var p=String(m).split('-');return MESES[(+p[1])-1]+' '+p[0];}
function mesActual(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function kb(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';}
/* Adivina el mes por el nombre del archivo: "noviembre 2026", "11-2026", "2026-11"… */
function mesDeNombre(n){
  var s=norm(n).toLowerCase(), y=(String(n).match(/(20\d\d)/)||[])[1], m=null, i;
  for(i=0;i<12;i++){var k=norm(MESES[i]).toLowerCase();if(s.indexOf(k)>=0||s.indexOf(k.slice(0,3)+' ')>=0){m=i+1;break;}}
  if(!m){var x=String(n).match(/(?:^|\D)(0?[1-9]|1[0-2])[-_. \/](20\d\d)(?:\D|$)/)||String(n).match(/(20\d\d)[-_. \/](0?[1-9]|1[0-2])(?:\D|$)/);
    if(x){if(x[1].length===4){y=x[1];m=+x[2];}else{m=+x[1];y=x[2];}}}
  if(!m) return '';
  if(!y){var d=new Date();y=d.getFullYear();if(m<d.getMonth()-5)y++;}
  return y+'-'+String(m).padStart(2,'0');
}
function viewMensuales(){
  var M=S.men, list=mensuales(), out='';
  if(!unlocked()) out+='<p class="note">Para subir o borrar grillas mensuales, entrá con la clave en <b>Cargar</b>.</p>';
  if(M.msg) out+='<div class="alert '+M.msg.kind+'">'+esc(M.msg.text)+'</div>';
  if(unlocked()&&!M.open) out+='<div class="actions"><button class="btn primary" type="button" id="b-men-open">+ Subir grilla mensual</button></div>';
  if(unlocked()&&M.open){
    out+='<form class="panel" id="f-men" autocomplete="off"><h3 class="sec" style="margin:0">Subir grilla mensual</h3>'+
      '<label class="drop" for="men-file"><input type="file" id="men-file" accept="application/pdf,.pdf" hidden>'+
      (M.file?'<b>'+esc(M.file.name)+'</b><span class="muted">'+kb(M.file.size)+' · tocá para cambiarlo</span>':'<b>Elegí el PDF</b><span class="muted">o arrastralo acá</span>')+'</label>'+
      (M.fileErr?'<div class="alert err">'+esc(M.fileErr)+'</div>':'')+
      '<div class="row"><div class="field"><label class="lbl" for="men-mes">Mes</label><input type="month" id="men-mes" value="'+esc(M.mes||mesActual())+'"></div>'+
      '<div class="field" style="flex:2 1 220px"><label class="lbl" for="men-tit">Título (opcional)</label><input type="text" id="men-tit" placeholder="Ej.: Grilla mensual San Sebastián" value="'+esc(M.titulo)+'"></div></div>'+
      '<div class="actions"><button class="btn primary" id="b-men-up"'+(M.busy||!M.file?' disabled':'')+'>'+(M.busy?'Subiendo…':'Guardar grilla mensual')+'</button>'+
      (M.file&&!M.busy?'<button class="btn" type="button" id="b-men-clr">Quitar archivo</button>':'')+(!M.busy?'<button class="btn" type="button" id="b-men-close">Cancelar</button>':'')+'</div></form>';
  }
  if(!list.length){
    out+='<div class="panel empty"><h2>Todavía no hay grillas mensuales</h2><p class="note">'+(unlocked()?'Subí el PDF de cada mes a medida que lo tengas.':'Cuando se suba la grilla del mes la vas a ver acá.')+'</p></div>';
    return out;
  }
  var y=null;
  out+='<div class="panel"><h3 class="sec" style="margin:0">Grillas mensuales</h3><div class="saved">';
  list.forEach(function(g){
    var yr=g.mes.slice(0,4);
    if(yr!==y){y=yr;out+='<div class="yr">'+esc(yr)+'</div>';}
    var abierto=M.ver===g.id;
    out+='<div class="it'+(g.mes===mesActual()?' cur':'')+'"><span><span class="w">'+esc(MESES[(+g.mes.slice(5))-1])+(g.mes===mesActual()?' <span class="badge-today">ESTE MES</span>':'')+'</span>'+
      '<br><span class="note">'+esc(g.titulo||g.nombre)+' · '+kb(g.size||0)+'</span></span><span class="actions">'+
      '<button class="btn small'+(abierto?' primary':'')+'" data-men-ver="'+esc(g.id)+'">'+(abierto?'Cerrar':'Ver')+'</button>'+
      (abierto?'<button class="btn small" data-men-zoom="1">'+(M.zoom?'Achicar':'Ampliar')+'</button>':'')+
      '<button class="btn small" data-men-dl="'+esc(g.id)+'">Descargar</button>'+
      (unlocked()?(M.confirm===g.id?'<button class="btn small danger" data-men-del-ok="'+esc(g.id)+'">Confirmar borrado</button><button class="btn small" data-men-del-no="1">No</button>':'<button class="btn small" data-men-del="'+esc(g.id)+'">Borrar</button>'):'')+
      '</span></div>'+(abierto?'<div class="pdfview'+(M.zoom?' zoom':'')+'" id="pdfview"><p class="note">Abriendo el PDF…</p></div>':'');
  });
  return out+'</div></div>';
}
function cargarPdfjs(){
  if(window.pdfjsLib&&window.pdfjsWorker) return Promise.resolve(window.pdfjsLib);
  if(pdfjsCarga) return pdfjsCarga;
  function sc(src){return new Promise(function(ok,ko){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=function(){ko(new Error('No pude cargar el visor de PDF. Revisá la conexión.'));};document.head.appendChild(s);});}
  pdfjsCarga=sc(PDFJS_URL+'pdf.worker.min.js').then(function(){return sc(PDFJS_URL+'pdf.min.js');}).then(function(){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_URL+'pdf.worker.min.js';return window.pdfjsLib;});
  pdfjsCarga.catch(function(){pdfjsCarga=null;});
  return pdfjsCarga;
}
function getMen(id){return (DATA.mensuales||[]).filter(function(g){return g.id===id;})[0]||null;}
var PDF_MEM={};
function b64aBuf(b){var bin=atob(b),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}
function bajarBytes(g){
  if(PDF_MEM[g.id]) return Promise.resolve(PDF_MEM[g.id].slice(0));
  if(!apiLista()) return Promise.reject(new Error('Falta configurar la URL del Apps Script.'));
  return fetch(API_URL+'?pdf='+encodeURIComponent(g.id)).then(function(r){if(!r.ok)throw new Error('No se pudo abrir el archivo ('+r.status+').');return r.json();})
    .then(function(d){if(!d||!d.ok||!d.b64)throw new Error(d&&d.error==='no-existe'?'El archivo ya no está disponible.':'No se pudo abrir el archivo.');
      var buf=b64aBuf(d.b64);PDF_MEM[g.id]=buf;return buf.slice(0);},
      function(e){throw new Error(e&&/archivo/.test(e.message)?e.message:'Sin conexión: no se pudo abrir el PDF.');});
}
function mostrarPdf(g){
  var box=document.getElementById('pdfview'); if(!box) return;
  Promise.all([cargarPdfjs(),bajarBytes(g)]).then(function(r){
    return r[0].getDocument({data:new Uint8Array(r[1])}).promise;
  }).then(function(pdf){
    if(S.men.ver!==g.id) return;
    box.innerHTML='';
    var w=Math.max(280,box.clientWidth-18)*(S.men.zoom?2.4:1), dpr=Math.min(window.devicePixelRatio||1,2), chain=Promise.resolve();
    for(var p=1;p<=pdf.numPages;p++)(function(p){chain=chain.then(function(){return pdf.getPage(p).then(function(pg){
      var v0=pg.getViewport({scale:1}), sc=w/v0.width, v=pg.getViewport({scale:sc*dpr});
      var c=document.createElement('canvas');c.width=v.width;c.height=v.height;c.style.width=Math.floor(v.width/dpr)+'px';
      c.setAttribute('aria-label','Página '+p+' de '+pdf.numPages);box.appendChild(c);
      return pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;});});})(p);
    return chain;
  }).catch(function(e){var b=document.getElementById('pdfview');if(b)b.innerHTML='<div class="alert err">'+esc(e&&e.message||'No se pudo mostrar el PDF.')+'</div>';});
}
function descargarMen(g){
  var name=(g.nombre&&/\.pdf$/i.test(g.nombre))?g.nombre:'Grilla mensual '+mesLabel(g.mes)+'.pdf';
  bajarBytes(g).then(function(buf){
    var blob=new Blob([buf],{type:'application/pdf'});
    if(DL) return DL.save({filename:name,data:blob}).catch(function(e){var c=e&&e.code;if(c==='declined')return;throw new Error('No se pudo descargar ('+(c||'error')+').');});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},5000);
  }).catch(function(e){S.men.msg={kind:'err',text:e.message};render();});
}
function elegirArchivo(f){
  S.men.fileErr='';
  if(!f) return;
  if(!/\.pdf$/i.test(f.name||'')&&f.type!=='application/pdf'){S.men.file=null;S.men.fileErr='Tiene que ser un archivo PDF.';render();return;}
  if(f.size>15*1048576){S.men.file=null;S.men.fileErr='El PDF pesa más de 15 MB. Probá comprimirlo.';render();return;}
  S.men.file=f; var m=mesDeNombre(f.name); if(m) S.men.mes=m;
  S.men.msg=null; render();
}
function leerB64(f){return new Promise(function(ok,ko){var r=new FileReader();r.onload=function(){ok(String(r.result).split(',')[1]||'');};r.onerror=function(){ko(new Error('No pude leer el archivo.'));};r.readAsDataURL(f);});}
function menError(r){
  var e=r&&r.error;
  if(e==='clave'){setOk(null);LOCK.err='La clave cambió o no es válida. Volvé a ingresarla en Cargar.';return 'La clave cambió o no es válida. Volvé a ingresarla en Cargar.';}
  return e==='grande'?'El PDF es demasiado grande.':'No se pudo completar ('+(e||'error')+').';
}
function subirMensual(){
  var M=S.men, f=M.file; if(!f||!unlocked()||M.busy) return;
  if(!apiLista()){M.msg={kind:'err',text:'Falta configurar la URL del Apps Script en index.html.'};render();return;}
  var mes=(document.getElementById('men-mes')||{}).value||M.mes||mesActual();
  var tit=((document.getElementById('men-tit')||{}).value||'').trim();
  if(!/^\d{4}-\d{2}$/.test(mes)){M.msg={kind:'err',text:'Elegí el mes.'};render();return;}
  M.mes=mes;M.titulo=tit;M.busy=true;M.msg={kind:'ok',text:'Subiendo el PDF…'};render();
  leerB64(f).then(function(b64){
    return api({accion:'subirMensual',h:S.okHash,mes:mes,titulo:tit,nombre:f.name,b64:b64});
  }).then(function(r){
    M.busy=false;
    if(!r||!r.ok){M.msg={kind:'err',text:menError(r)};render();return;}
    DATA.mensuales=r.mensuales||DATA.mensuales;guardarCache();
    M.file=null;M.titulo='';M.open=false;M.msg={kind:'ok',text:'Grilla mensual guardada: '+mesLabel(mes)+'.'};render();
  },function(e){M.busy=false;M.msg={kind:'err',text:(e&&/archivo/.test(e.message))?e.message:'Sin conexión: no se pudo subir. Probá de nuevo.'};render();});
}
function borrarMensual(id){
  var g=getMen(id); if(!g) return;
  S.men.confirm=null;S.men.busy=true;S.men.msg={kind:'ok',text:'Borrando…'};render();
  api({accion:'borrarMensual',h:S.okHash,id:id}).then(function(r){
    S.men.busy=false;
    if(!r||!r.ok){S.men.msg={kind:'err',text:menError(r)};render();return;}
    DATA.mensuales=r.mensuales||[];guardarCache();delete PDF_MEM[id];if(S.men.ver===id)S.men.ver=null;
    S.men.msg={kind:'ok',text:'Grilla mensual borrada: '+mesLabel(g.mes)+'.'};render();
  },function(){S.men.busy=false;S.men.msg={kind:'err',text:'Sin conexión: no se pudo borrar.'};render();});
}
/* Junta todos los datos de la página (semanas, clave, mensuales) con los cambios. */
function datos(cambios){var o={semanas:DATA.semanas,clave:DATA.clave,mensuales:DATA.mensuales||[]};for(var k in cambios)o[k]=cambios[k];return o;}

function weekSelect(){
  var ws=sorted();
  return '<div class="field"><label class="lbl" for="sel-week">Semana</label><select id="sel-week">'+
    ws.map(function(w){return '<option value="'+esc(w.id)+'"'+(w.id===S.weekId?' selected':'')+'>'+esc(weekLabel(w))+'</option>';}).join('')+
    '</select></div>';
}
function noWeeks(){
  return '<div class="panel empty"><h2>Todavía no hay grillas cargadas</h2><p class="note">'+
    (S.canSave?'Andá a <b>Cargar</b>, elegí el tipo de grilla, poné las fechas y los nombres.':'Cuando se cargue la grilla de la semana la vas a ver acá.')+'</p></div>';
}

function viewBuscar(){
  if(!DATA.semanas.length) return noWeeks();
  var w=getWeek(S.weekId)||getWeek(defaultWeek());
  var names={};
  ['insp','sup'].forEach(function(r){(w[r]||[]).forEach(function(n){if(n)names[n]=1;});});
  return '<div class="panel"><div class="row">'+
    '<div class="field" style="flex:2 1 240px"><label class="lbl" for="q">Apellido</label><input id="q" type="search" list="dl-names" autocomplete="off" placeholder="Ej.: Medina" value="'+esc(S.q)+'"></div>'+
    weekSelect()+'</div><datalist id="dl-names">'+Object.keys(names).sort().map(function(n){return '<option value="'+esc(n)+'">';}).join('')+'</datalist></div>'+
    '<div id="results">'+resultsHtml(w)+'</div>';
}

function resultsHtml(w){
  var q=norm(S.q);
  if(!q) return '<div class="panel empty"><h2>Escribí un apellido</h2><p class="note">Vas a ver cada día de la semana: sector, horario y con quién te toca.</p></div>';
  var found=[], seen={};
  ['insp','sup'].forEach(function(role){(w[role]||[]).forEach(function(n,i){
    if(n && norm(n).indexOf(q)!==-1 && !seen[role+(i+1)]){seen[role+(i+1)]=1;found.push({role:role,k:i+1,name:n});}
  });});
  if(!found.length) return '<div class="panel empty"><h2>Sin resultados</h2><p class="note">Nadie con “'+esc(S.q)+'” en la semana '+esc(weekLabel(w))+'. Probá con otra semana o revisá cómo está escrito.</p></div>';
  var days=assignments(w), t=todayIso();
  return found.map(function(p){
    var cards=[];
    for(var i=0;i<8;i++){
      if(!inRange(w,i)) continue;
      var me=null; days[i].forEach(function(a){if(a.role===p.role&&a.k===p.k)me=a;});
      if(!me) continue;
      var mates=days[i].filter(function(a){return !(a.role===p.role&&a.k===p.k)&&a.sector===me.sector&&overlap(a.h,me.h)>30;});
      var ins=mates.filter(function(a){return a.role==='insp';}), sup=mates.filter(function(a){return a.role==='sup';});
      var d=dayDate(w,i), isT=iso(d)===t;
      var sub=i===0?' · desde las 13':(i===7?' · hasta las 13':'');
      cards.push('<article class="day '+me.sector+(isT?' today':'')+'">'+
        '<div class="day-h"><span class="dname">'+DIAS[i]+'<span class="dd">'+dm(d)+'</span></span>'+(isT?'<span class="badge-today">HOY</span>':'<span class="chip '+me.sector+'">'+me.sector+'</span>')+'</div>'+
        (isT?'<div><span class="chip '+me.sector+'">'+me.sector+'</span></div>':'')+
        '<div class="hora">'+esc(fmtH(me.h))+'</div><div class="turno">'+esc(me.turno)+esc(me.adj?'':sub)+(me.adj?' · <span class="adj-tag">horario especial</span>':'')+'</div>'+
        '<div class="with">'+
          (ins.length?'<div><b>Inspectores</b>'+ins.map(function(a){return esc(a.name)+' <span class="muted">('+esc(fmtH(a.h))+')</span>';}).join(', ')+'</div>':(p.role==='insp'?'<div><b>Inspectores</b><span class="muted">sin compañeros en el sector</span></div>':''))+
          (sup.length?'<div><b>Supervisor</b>'+sup.map(function(a){return esc(a.name)+' <span class="muted">('+esc(fmtH(a.h))+')</span>';}).join(', ')+'</div>':'')+
        '</div></article>');
    }
    return '<section class="person"><div class="person-h"><h2>'+esc(p.name)+'</h2><span class="chip sup">'+roleName(p.role)+'</span><span class="muted">'+esc(weekLabel(w))+'</span></div><div class="days">'+cards.join('')+'</div></section>';
  }).join('');
}

function gridHtml(w,hl){
  var t=TPL_BY[w.tipo]; if(!t) return '';
  var days=assignments(w), hq=norm(hl||'');
  function nm(n){return '<td class="nm'+(hq&&norm(n).indexOf(hq)!==-1?' hit':'')+'">'+(esc(n)||'<span class="muted">—</span>')+'</td>';}
  function head(){
    var h='<thead><tr><th>Sector</th><th>Turno</th><th>Horario</th>';
    for(var i=1;i<=6;i++) h+='<th>'+DC[i]+'<span class="dd">'+dm(dayDate(w,i))+'</span></th>';
    return h+'<th>Vie cierre<span class="dd">'+dm(dayDate(w,7))+'</span></th></tr></thead>';
  }
  function body(role){
    var rows=role==='insp'?t.rows:t.sup, names=w[role]||[];
    return '<tbody>'+rows.map(function(r){
      var c='<tr><td><span class="chip '+r.s+'">'+r.s+'</span></td><td>'+esc(r.t)+'</td><td>'+esc(fmtH(r.h))+'</td>';
      for(var j=0;j<6;j++) c+=nm(names[r.d[j]-1]);
      var ca=null;
      days[7].forEach(function(a){if(a.slot===role+':'+r.d[6])ca=a;});
      var last=ca?ca.name:(names[r.d[6]-1]||'');
      c+='<td class="nm'+(hq&&norm(last).indexOf(hq)!==-1?' hit':'')+(ca&&ca.adj?' adjc':'')+'">'+(esc(last)||'<span class="muted">—</span>')+'<span class="t">'+esc(fmtH(ca?ca.h:r.vh))+(ca&&ca.sector!==r.s?' · '+ca.sector:'')+(ca&&ca.adj?' · ajustado':'')+'</span></td>';
      return c+'</tr>';
    }).join('')+'</tbody>';
  }
  function iniBox(tu){
    var lines=['SALIDA','ENTRADA'].map(function(sec){
      var lab=function(a){return (a.name||'—')+(a.adj?' ('+fmtH(a.h)+')':'');};
      var ins=days[0].filter(function(a){return a.role==='insp'&&a.sector===sec&&a.turno===(tu===1?'1er turno':'2do turno');}).map(lab);
      var su=days[0].filter(function(a){return a.role==='sup'&&a.sector===sec&&a.turno===(tu===1?'1er turno':'2do turno');}).map(lab);
      return '<div class="line"><span class="chip '+sec+'">'+sec+'</span><span>'+esc(ins.join(', '))+'</span><span class="muted">· Sup. '+esc(su.join(', '))+'</span></div>';
    }).join('');
    return '<div class="box"><h4>'+(tu===1?'1er turno · 13:00 a 17:30':'2do turno · 17:20 a 22:00')+'</h4>'+lines+'</div>';
  }
  return '<h3 class="sec">Viernes de inicio · '+dm(dayDate(w,0))+'</h3><div class="ini">'+iniBox(1)+iniBox(2)+'</div>'+
    '<h3 class="sec">Inspectores</h3><div class="tbl-wrap"><table>'+head()+body('insp')+'</table></div>'+
    '<h3 class="sec">Supervisores</h3><div class="tbl-wrap"><table>'+head()+body('sup')+'</table></div>';
}

function viewGrilla(){
  if(!DATA.semanas.length) return noWeeks();

  return '<div class="panel"><div class="row">'+weekSelect()+'</div>'+

    '<div class="panel"><div class="actions">'+pdfBtn(w.id,'Descargar PDF de la grilla')+'</div>'+gridHtml(w,S.q)+'</div>';
}

function slotHint(t,role,k){
  var rows=role==='insp'?t.rows:t.sup, b='';
  rows.forEach(function(r){if(r.d[6]===k)b=fmtH(r.vh)+' en '+r.vs.toLowerCase();});
  return 'Cierra el viernes siguiente de '+b+(role==='insp'&&t.fijo===k?' · turno fijo':'');
}

function viewCargar(){
  if(!S.form) S.form=newForm(null);
  var f=S.form, t=TPL_BY[f.tipo];
  var tipos='<div class="tipos" role="radiogroup" aria-label="Tipo de grilla">'+TPL.map(function(x){
    return '<label><input type="radio" name="tipo" value="'+x.id+'"'+(x.id===f.tipo?' checked':'')+'> '+esc(x.nombre)+'</label>';}).join('')+'</div>';
  /* Dos columnas: quienes entran el viernes en el 1er turno y quienes en el 2do. */
  function slots(role){
    var ini=role==='insp'?t.ini:SUP_INI;
    function col(tu){
      var out='<div class="col"><h4>'+(tu===1?'Entran en el 1er turno':'Entran en el 2do turno')+'<span>Viernes '+(tu===1?'13:00 a 17:30':'17:20 a 22:00')+'</span></h4>';
      ini.filter(function(g){return g.tu===tu;}).forEach(function(g){g.k.forEach(function(k){
        var ph=t.planilla[role][k-1]||'';
        out+='<div class="slot"><label class="lbl" for="f-'+role+'-'+k+'"><span class="chip '+g.s+'">'+g.s+'</span>Posición '+k+'</label>'+
          '<input type="text" id="f-'+role+'-'+k+'" data-role="'+role+'" data-k="'+k+'" autocomplete="off" placeholder="'+esc(ph)+'" value="'+esc(f[role][k-1]||'')+'">'+
          '<span class="hint">'+esc(slotHint(t,role,k))+'</span></div>';
      });});
      return out+'</div>';
    }
    return '<div class="cols">'+col(1)+col(2)+'</div>';
  }
  var saved=sorted();
  return (S.msg?'<div class="alert '+S.msg.kind+'">'+esc(S.msg.text)+'</div>':'')+
   (S.pdfId&&getWeek(S.pdfId)?'<div class="panel" style="flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap"><span><b>PDF de la grilla listo</b><br><span class="note">'+esc(pdfNombre(getWeek(S.pdfId)))+'</span></span><span class="actions">'+pdfBtn(S.pdfId,'Descargar PDF')+'<button class="btn small" id="b-pdf-x">Cerrar</button></span></div>':'')+
   '<div class="panel"><h3 class="sec" style="margin:0">'+(f.editId?'Editar grilla':'Nueva grilla')+'</h3>'+
   '<div class="field"><span class="lbl">Tipo de grilla</span>'+tipos+'</div>'+
   '<div class="row"><div class="field"><label class="lbl" for="f-desde">Desde (viernes)</label><input type="date" id="f-desde" value="'+esc(f.desde)+'"></div>'+
   '<div class="field"><label class="lbl" for="f-hasta">Hasta (viernes)</label><input type="date" id="f-hasta" value="'+esc(f.hasta)+'"></div></div>'+
   '<div id="date-warn"></div>'+
   '<div class="field"><span class="lbl">Inspectores</span>'+slots('insp')+'</div>'+
   '<div class="field"><span class="lbl">Supervisores</span>'+slots('sup')+'</div>'+
   '<div id="form-warn"></div>'+
   '<div class="actions"><button class="btn primary" id="b-save"'+(S.saving?' disabled':'')+'>'+(S.saving?'Guardando…':(f.editId?'Guardar cambios':'Guardar grilla'))+'</button>'+
   '<button class="btn" id="b-fill">Completar con los nombres de la planilla</button>'+
   (f.editId?'<button class="btn" id="b-cancel">Cancelar edición</button>':'<button class="btn" id="b-clear">Vaciar nombres</button>')+'</div></div>'+
   '<div class="panel"><h3 class="sec" style="margin:0">Vista previa</h3>'+
   '<p class="note">Para cambiar a alguien de lugar un viernes, elegí las dos personas y tocá <b>Intercambiar</b>: cada una pasa al sector y horario de la otra. En la grilla aparece cada nombre directamente en su lugar nuevo.</p>'+
   '<div id="fri-edit"></div><div id="preview"></div></div>'+
   '<div class="panel"><h3 class="sec" style="margin:0">Grillas guardadas</h3>'+
   (saved.length?'<div class="saved">'+saved.map(function(w){
     return '<div class="it"><span class="w">'+esc(weekLabel(w))+'</span><span class="actions">'+
       pdfBtn(w.id)+'<button class="btn small" data-edit="'+esc(w.id)+'">Editar</button>'+
       (S.confirmDel===w.id?'<button class="btn small danger" data-del-ok="'+esc(w.id)+'">Confirmar borrado</button><button class="btn small" data-del-no="1">No</button>':'<button class="btn small" data-del="'+esc(w.id)+'">Borrar</button>')+
       '</span></div>';}).join('')+'</div>':'<p class="note">Todavía no guardaste ninguna.</p>')+'</div>';
}

function formWarnings(){
  var f=S.form, t=TPL_BY[f.tipo], out=[], dw=[];
  if(f.desde){ if(fromIso(f.desde).getDay()!==5) dw.push('La fecha “desde” no es viernes. Las grillas arrancan el viernes a las 13:00.'); }
  if(f.desde&&f.hasta){ if(f.hasta<f.desde) dw.push('“Hasta” es anterior a “desde”.');
    else if(iso(add(fromIso(f.desde),7))!==f.hasta) dw.push('La grilla cubre de viernes a viernes (8 días). Con estas fechas se van a mostrar solo los días dentro del rango.'); }
  var all=[];
  ['insp','sup'].forEach(function(r){var n=r==='insp'?t.n:4;for(var k=0;k<n;k++){var v=clean(f[r][k]);if(v)all.push(v);}});
  var dup=all.filter(function(v,i){return all.indexOf(v)!==i;});
  if(dup.length) out.push('Repetido: '+dup.filter(function(v,i){return dup.indexOf(v)===i;}).join(', ')+'.');
  var dwEl=document.getElementById('date-warn'), fwEl=document.getElementById('form-warn');
  if(dwEl) dwEl.innerHTML=dw.map(function(x){return '<div class="alert warn">'+esc(x)+'</div>';}).join('');
  if(fwEl) fwEl.innerHTML=out.map(function(x){return '<div class="alert warn">'+esc(x)+'</div>';}).join('');
}
function formWeek(noAdj){var f=S.form;return {tipo:f.tipo,desde:f.desde||iso(nextFriday()),hasta:f.hasta||iso(add(nextFriday(),7)),insp:f.insp.map(clean),sup:f.sup.map(clean),ajustes:noAdj?{}:f.ajustes,cambios:noAdj?[]:(f.cambios||[])};}
function hParts(h){var m=String(h).match(/(\d{1,2}:\d{2})\D+(\d{1,2}:\d{2})/);return m?[m[1].padStart(5,'0'),m[2].padStart(5,'0')]:['',''];}
function baseOf(i,role,k){var r=null;assignments(formWeek(true))[i].forEach(function(a){if(a.role===role&&a.k===k)r=a;});return r;}
function friEditor(w,i){
  var day=assignments(w)[i].slice(), f=S.form, sel=(f.sel&&f.sel[i])||{};
  day.sort(function(a,b){
    if(i===0&&a.turno!==b.turno) return a.turno<b.turno?-1:1;
    if(a.role!==b.role) return a.role==='insp'?-1:1;
    if(a.sector!==b.sector) return a.sector==='SALIDA'?-1:1;
    return rng(a.h)[0]-rng(b.h)[0];
  });
  var title=i===0?'Viernes de inicio · '+dm(dayDate(w,0)):'Viernes de cierre · '+dm(dayDate(w,7));
  var con=day.filter(function(a){return a.name;});
  function opts(v){
    var out='<option value="">Elegí…</option>', grp=null;
    con.forEach(function(a){
      var g=a.role==='insp'?'Inspectores':'Supervisores';
      if(g!==grp){if(grp)out+='</optgroup>';out+='<optgroup label="'+g+'">';grp=g;}
      out+='<option value="'+esc(a.slot)+'"'+(a.slot===v?' selected':'')+'>'+esc(a.name)+' — '+esc(a.sector)+' '+esc(fmtH(a.h))+'</option>';
    });
    return out+(grp?'</optgroup>':'');
  }
  var hechos=(f.cambios||[]).map(function(c,n){return {c:c,n:n};}).filter(function(o){return o.c.d===i;});
  var w0={tipo:w.tipo,desde:w.desde,hasta:w.hasta,insp:w.insp,sup:w.sup,ajustes:w.ajustes,cambios:[]};
  function quien(slot){var r='';assignments(w0)[i].forEach(function(a){if(a.slot===slot)r=a.name;});return r||'—';}
  var out='<div class="fri"><h3 class="sec">'+title+'</h3>';
  if(con.length<2) return out+'<p class="note">Completá los nombres para poder intercambiar lugares.</p></div>';
  out+='<div class="swap"><div class="field"><label class="lbl" for="sw-a-'+i+'">Persona 1</label><select id="sw-a-'+i+'" data-sw="'+i+'" data-f="a">'+opts(sel.a)+'</select></div>'+
    '<span class="swap-ico" aria-hidden="true">⇄</span>'+
    '<div class="field"><label class="lbl" for="sw-b-'+i+'">Persona 2</label><select id="sw-b-'+i+'" data-sw="'+i+'" data-f="b">'+opts(sel.b)+'</select></div>'+
    '<button class="btn primary" type="button" data-sw-go="'+i+'"'+(sel.a&&sel.b?'':' disabled')+'>Intercambiar</button></div>'+
    (sel.err?'<div class="alert warn">'+esc(sel.err)+'</div>':'');
  if(hechos.length) out+='<div class="sw-list">'+hechos.map(function(o){
    return '<div class="sw-it"><span><b>'+esc(quien(o.c.x))+'</b> ⇄ <b>'+esc(quien(o.c.y))+'</b></span><button class="btn small" type="button" data-sw-undo="'+o.n+'">Deshacer</button></div>';
  }).join('')+'</div>';
  return out+'</div>';
}
function renderPreviewGrid(){var el=document.getElementById('preview');if(el)el.innerHTML=gridHtml(formWeek(),'');}
function renderPreview(){
  var w=formWeek(), fe=document.getElementById('fri-edit');
  if(fe) fe.innerHTML=friEditor(w,0)+friEditor(w,7);
  renderPreviewGrid();formWarnings();
}
function onAdjChange(key){
  var row=document.querySelector('tr[data-row="'+key+'"]'); if(!row) return;
  var s=row.querySelector('[data-f="s"]').value, a=row.querySelector('[data-f="a"]').value, b=row.querySelector('[data-f="b"]').value;
  var p=key.split(':'), base=baseOf(+p[0],p[1],+p[2]); if(!base||!a||!b) return;
  var h=a+' A '+b, bp=hParts(base.h);
  if(s===base.sector&&a===bp[0]&&b===bp[1]) delete S.form.ajustes[key];
  else S.form.ajustes[key]={s:s,h:h};
  var on=!!S.form.ajustes[key];
  row.className=on?'adj':'';
  row.querySelector('.rs').innerHTML=on?'<button class="btn small" data-reset="'+key+'">Restablecer</button>':'';
  renderPreviewGrid();
}

/* ---------- render ---------- */
function render(){
  aplicarPlanillas();
  var tabs=[['buscar','Buscar'],['grilla','Grilla'],['mensuales','Mensuales'],['cargar',(unlocked()?'':LOCK_SVG)+'Cargar']];
  var body=S.tab==='buscar'?viewBuscar():S.tab==='mensuales'?viewMensuales():(S.tab==='grilla'?viewGrilla():(unlocked()?lockBar()+viewCargar():viewLock()));
  document.getElementById('app').innerHTML='<div class="wrap"><header class="top"><div class="brand"><h1>Grillas Paso San Sebastián</h1><small>Migraciones · Tierra del Fuego</small></div>'+
    '<nav class="tabs" role="tablist">'+tabs.map(function(x){return '<button role="tab" data-tab="'+x[0]+'" aria-selected="'+(S.tab===x[0])+'">'+x[1]+'</button>';}).join('')+'</nav></header>'+
    (S.offline?'<div class="alert warn">Sin conexión: estás viendo la última grilla descargada.</div>':'')+(!apiLista()?'<div class="alert err">Falta configurar la URL del Apps Script en index.html.</div>':'')+
    body+'</div>';
  if(S.tab==='cargar'&&unlocked()) renderPreview();
  if(S.tab==='mensuales'&&S.men.ver){var g=getMen(S.men.ver);if(g)mostrarPdf(g);}
  if(S.tab==='cargar'&&!unlocked()){var f1=document.querySelector('#k-in,#k-new');if(f1)try{f1.focus();}catch(e){}}
}

/* ---------- guardar en la planilla ---------- */
function publish(next,okText){
  if(!apiLista()){S.msg={kind:'err',text:'Falta configurar la URL del Apps Script en index.html.'};render();return;}
  if(!S.okHash){LOCK.err='Ingresá la clave para guardar.';render();return;}
  S.saving=true;S.msg={kind:'ok',text:'Guardando…'};render();
  api({accion:'guardar',h:S.okHash,semanas:next.semanas}).then(function(r){
    S.saving=false;
    if(!r||!r.ok){
      if(r&&r.error==='clave'){setOk(null);S.msg=null;LOCK.err='La clave cambió o no es válida. Volvé a ingresarla.';}
      else S.msg={kind:'err',text:'No se pudo guardar ('+((r&&r.error)||'error')+'). Probá de nuevo.'};
      S.flashPdf=false;render();return;
    }
    DATA.semanas=Array.isArray(r.semanas)?r.semanas:next.semanas;guardarCache();S.offline=false;
    if(S.flashPdf&&getWeek(S.weekId)){S.pdfId=S.weekId;S.form=null;}S.flashPdf=false;
    if(!getWeek(S.weekId)) S.weekId=defaultWeek();
    S.msg={kind:'ok',text:okText};render();
  },function(){S.saving=false;S.flashPdf=false;S.msg={kind:'err',text:'Sin conexión: no se pudo guardar. Probá de nuevo.'};render();});
}
function saveForm(){
  var f=S.form, t=TPL_BY[f.tipo], insp=[], sup=[], k;
  for(k=0;k<t.n;k++) insp.push(clean(f.insp[k]));
  for(k=0;k<4;k++) sup.push(clean(f.sup[k]));
  var miss=insp.filter(function(x){return !x;}).length+sup.filter(function(x){return !x;}).length;
  if(!f.desde||!f.hasta){S.msg={kind:'err',text:'Completá las fechas desde y hasta.'};render();return;}
  if(f.hasta<f.desde){S.msg={kind:'err',text:'La fecha “hasta” es anterior a “desde”.'};render();return;}
  if(miss){S.msg={kind:'err',text:'Faltan '+miss+' nombre'+(miss>1?'s':'')+'. Completá todas las posiciones.'};render();return;}
  var w={id:f.editId||('g'+Date.now().toString(36)),tipo:f.tipo,desde:f.desde,hasta:f.hasta,insp:insp,sup:sup,ajustes:f.ajustes||{},cambios:f.cambios||[],guardado:new Date().toISOString()};
  var next=datos({semanas:DATA.semanas.filter(function(x){return x.id!==w.id;}).concat([w]).sort(function(a,b){return b.desde.localeCompare(a.desde);})});
  S.weekId=w.id;S.flashPdf=true;S.pdfId=null;
  publish(next,'Grilla guardada: '+weekLabel(w)+'.');
}

/* ---------- eventos ---------- */
var app=document.getElementById('app');
app.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.tab){if(b.dataset.tab!==S.tab&&!S.men.busy){S.men.open=false;S.men.file=null;S.men.fileErr='';}S.tab=b.dataset.tab;S.msg=null;S.men.msg=null;S.men.confirm=null;LOCK.err='';LOCK.mode=null;render();return;}
  if(b.id==='b-retry'){S.offline=false;S.lastErr='';render();cargar();return;}
  if(b.id==='b-lock'){setOk(null);LOCK.err='';LOCK.mode=null;S.msg=null;render();return;}
  if(b.id==='b-chg'){LOCK.mode=LOCK.mode==='change'?null:'change';LOCK.err='';render();return;}
  if(b.dataset.pdf){descargarPdf(b.dataset.pdf);return;}
  if(b.id==='b-men-up'){e.preventDefault();subirMensual();return;}
  if(b.id==='b-men-open'){S.men.open=true;S.men.msg=null;render();var fm=document.getElementById('f-men');if(fm)fm.scrollIntoView({block:'nearest'});return;}
  if(b.id==='b-men-close'){S.men.open=false;S.men.file=null;S.men.fileErr='';S.men.titulo='';render();return;}
  if(b.id==='b-men-clr'){S.men.file=null;S.men.fileErr='';render();return;}
  if(b.dataset.menVer){S.men.ver=S.men.ver===b.dataset.menVer?null:b.dataset.menVer;S.men.zoom=false;render();return;}
  if(b.dataset.menZoom){S.men.zoom=!S.men.zoom;render();return;}
  if(b.dataset.menDl){var g=getMen(b.dataset.menDl);if(g)descargarMen(g);return;}
  if(b.dataset.menDel){S.men.confirm=b.dataset.menDel;render();return;}
  if(b.dataset.menDelNo){S.men.confirm=null;render();return;}
  if(b.dataset.menDelOk){borrarMensual(b.dataset.menDelOk);return;}
  if(b.id==='b-pdf-x'){S.pdfId=null;render();return;}
  if(b.id==='b-save'){saveForm();return;}
  if(b.id==='b-fill'){var t=TPL_BY[S.form.tipo];S.form.insp=t.planilla.insp.slice();S.form.sup=t.planilla.sup.slice();render();return;}
  if(b.id==='b-clear'){S.form.insp=[];S.form.sup=[];S.form.ajustes={};S.form.cambios=[];render();return;}
  if(b.dataset.reset){var key=b.dataset.reset;delete S.form.ajustes[key];renderPreview();return;}
  if(b.dataset.swGo){var d=+b.dataset.swGo, s=(S.form.sel||{})[d]||{};
    if(!s.a||!s.b) return;
    if(s.a===s.b){s.err='Elegí dos personas distintas.';renderPreview();return;}
    if(s.a.split(':')[0]!==s.b.split(':')[0]){s.err='Solo se puede intercambiar inspector con inspector, o supervisor con supervisor.';renderPreview();return;}
    S.form.cambios=(S.form.cambios||[]).concat([{d:d,x:s.a,y:s.b}]);S.form.sel[d]={};renderPreview();return;}
  if(b.dataset.swUndo!=null){var n=+b.dataset.swUndo;S.form.cambios=(S.form.cambios||[]).filter(function(c,k){return k!==n;});renderPreview();return;}
  if(b.id==='b-cancel'){S.form=newForm(null);S.msg=null;render();return;}
  if(b.dataset.edit){var w=getWeek(b.dataset.edit);if(w){S.form=newForm(w);S.msg=null;render();window.scrollTo({top:0});}return;}
  if(b.dataset.del){S.confirmDel=b.dataset.del;render();return;}
  if(b.dataset.delNo){S.confirmDel=null;render();return;}
  if(b.dataset.delOk){var id=b.dataset.delOk, old=getWeek(id);S.confirmDel=null;
    var next=datos({semanas:DATA.semanas.filter(function(x){return x.id!==id;})});
    if(S.weekId===id) S.weekId=null;
    if(S.pdfId===id) S.pdfId=null;
    publish(next,'Grilla borrada'+(old?': '+weekLabel(old):'')+'.');
    return;}
});
app.addEventListener('dragover',function(e){var d=e.target.closest&&e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over');}});
app.addEventListener('dragleave',function(e){var d=e.target.closest&&e.target.closest('.drop');if(d)d.classList.remove('over');});
app.addEventListener('drop',function(e){var d=e.target.closest&&e.target.closest('.drop');if(!d)return;e.preventDefault();elegirArchivo(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]);});
app.addEventListener('submit',function(e){
  e.preventDefault();
  var id=e.target.id;
  if(id==='f-men'){subirMensual();return;}
  function v(x){var el=document.getElementById(x);return el?el.value.trim():'';}
  function fail(t){LOCK.err=t;LOCK.busy=false;render();}
  function cryptoFail(){fail('Este navegador no permite verificar la clave. Probá desde Chrome o Safari actualizados.');}
  function netFail(){fail('Sin conexión con la planilla. Probá de nuevo.');}
  if(id==='f-unlock'){
    var pw=v('k-in'); if(!pw) return fail('Escribí la clave.');
    if(!DATA.clave) return netFail();
    LOCK.busy=true;LOCK.err='';render();
    sha(DATA.clave.salt+pw).then(function(h){
      return api({accion:'verificar',h:h}).then(function(r){
        LOCK.busy=false;
        if(r&&r.ok){setOk(h);LOCK.err='';render();} else fail('Clave incorrecta.');
      },netFail);
    },cryptoFail);
    return;
  }
  if(id==='f-change'){
    var nw=v('k-new'), rp=v('k-rep'), cur=v('k-cur');
    if(nw.length<4) return fail('La clave tiene que tener al menos 4 caracteres.');
    if(nw!==rp) return fail('Las dos claves no coinciden.');
    var salt=randHex();
    Promise.all([sha(DATA.clave.salt+cur),sha(salt+nw)]).then(function(hs){
      LOCK.busy=true;LOCK.err='';render();
      api({accion:'clave',h:hs[0],salt:salt,nuevo:hs[1]}).then(function(r){
        LOCK.busy=false;
        if(!r||!r.ok) return fail(r&&r.error==='clave'?'La clave actual no es correcta.':'No se pudo cambiar la clave.');
        DATA.clave={salt:salt};guardarCache();setOk(hs[1]);LOCK.mode=null;S.msg={kind:'ok',text:'Clave cambiada.'};render();
      },netFail);
    },cryptoFail);
  }
});
app.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='q'){S.q=el.value;try{localStorage.setItem('grillas-q',S.q);}catch(x){}
    var w=getWeek(S.weekId)||getWeek(defaultWeek());var r=document.getElementById('results');if(r&&w)r.innerHTML=resultsHtml(w);return;}
  if(el.id==='men-tit'){S.men.titulo=el.value;return;}
  if(el.dataset.role){S.form[el.dataset.role][(+el.dataset.k)-1]=el.value;renderPreview();return;}
});
app.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='men-file'){elegirArchivo(el.files&&el.files[0]);return;}
  if(el.id==='men-mes'){S.men.mes=el.value;return;}
  if(el.id==='sel-week'){S.weekId=el.value;render();var q=document.getElementById('q');if(q&&S.tab==='buscar'){}return;}
  if(el.name==='tipo'){S.form.tipo=el.value;S.form.ajustes={};S.form.cambios=[];S.form.sel={};render();return;}
  if(el.dataset.aj){onAdjChange(el.dataset.aj);return;}
  if(el.dataset.sw!=null){var d=+el.dataset.sw;S.form.sel=S.form.sel||{};var s=S.form.sel[d]=S.form.sel[d]||{};s[el.dataset.f]=el.value;s.err='';renderPreview();return;}
  if(el.id==='f-desde'){S.form.desde=el.value;if(el.value){S.form.hasta=iso(add(fromIso(el.value),7));var h=document.getElementById('f-hasta');if(h)h.value=S.form.hasta;}renderPreview();return;}
  if(el.id==='f-hasta'){S.form.hasta=el.value;renderPreview();return;}
});

if(!S.weekId) S.weekId=defaultWeek();
render();

function cargar(){
  if(!apiLista()) return;
  fetch(API_URL+'?t='+Date.now()).then(function(r){if(!r.ok)throw new Error('respuesta '+r.status);return r.text();}).then(function(tx){try{return JSON.parse(tx);}catch(e){throw new Error('la URL no devuelve datos (¿acceso Cualquier usuario?)');}}).then(function(d){
    if(!d||!Array.isArray(d.semanas)) throw new Error('formato');
    DATA={semanas:d.semanas,clave:d.clave||null,planillas:d.planillas||{},mensuales:Array.isArray(d.mensuales)?d.mensuales:[]};guardarCache();
    S.offline=false;
    if(!getWeek(S.weekId)) S.weekId=defaultWeek();
    var a=document.activeElement, typing=a&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&a.type!=='button';
    if(S.men.busy||S.saving) return;
    if(!typing&&!(S.tab==='mensuales'&&S.men.open)) render();
    else if(S.tab==='buscar'){var w=getWeek(S.weekId);var res=document.getElementById('results');if(res&&w)res.innerHTML=resultsHtml(w);}
  }).catch(function(e){S.offline=true;S.lastErr=(e&&e.message)||'';render();});
}
cargar();
setTimeout(function(){cargarJsPdf().catch(function(){});},1500);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!S.saving&&!S.men.busy&&S.tab!=='cargar')cargar();});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
